name: Publicar instalador

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  velopack-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify tag points to the approved main revision
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $mainSha = (git rev-parse origin/main).Trim()
          if ($env:GITHUB_SHA -ne $mainSha) {
            throw "La etiqueta apunta a $env:GITHUB_SHA, pero main aprobado apunta a $mainSha. No se publicará el instalador."
          }

      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "La etiqueta debe usar SemVer, por ejemplo v0.1.0-alpha.1."
          }

          $coreVersion = ($version -split '[+-]', 2)[0]
          $revision = 0
          if ($version -match '-(?:[^+]*\.)?([0-9]+)(?:\+.*)?$') {
            $revision = [int]$Matches[1]
          }

          $assemblyVersion = "$coreVersion.0"
          $fileVersion = "$coreVersion.$revision"

          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore packages
        run: dotnet restore PeluqueriaAdmin.sln

      - name: Verify format
        run: dotnet format PeluqueriaAdmin.sln --verify-no-changes --no-restore

      - name: Test Release
        run: dotnet test PeluqueriaAdmin.sln --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/PeluqueriaAdmin.App/PeluqueriaAdmin.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.file_version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}

      - name: Verify published executable version
        shell: pwsh
        run: |
          $exe = Resolve-Path `
            "artifacts/publish/PeluqueriaAdmin.App.exe"
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)

          if ($info.ProductVersion -ne "${{ steps.version.outputs.version }}") {
            throw "ProductVersion incorrecta. Esperada: ${{ steps.version.outputs.version }}. Encontrada: $($info.ProductVersion)."
          }

          if ($info.FileVersion -ne "${{ steps.version.outputs.file_version }}") {
            throw "FileVersion incorrecta. Esperada: ${{ steps.version.outputs.file_version }}. Encontrada: $($info.FileVersion)."
          }

      - name: Install matching Velopack CLI
        run: dotnet tool install --tool-path .tools vpk --version 1.2.0

      - name: Download previous Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $feedCount = gh api "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq 'map(select(.draft == false) | .assets[]? | select(.name == "releases.win.json")) | length'
          if ([int]$feedCount -gt 0) {
            $arguments = @(
              "download", "github",
              "--repoUrl", "https://github.com/$env:GITHUB_REPOSITORY",
              "--token", $env:GH_TOKEN,
              "--outputDir", "Releases")
            if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
              $arguments += @("--pre", "true")
            }
            & .\.tools\vpk.exe @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer and update packages
        shell: pwsh
        run: |
          .\.tools\vpk.exe pack `
            --packId Colombianito.PeluqueriaAdmin `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe PeluqueriaAdmin.App.exe `
            --packTitle "Peluquería Admin" `
            --packAuthors "colombianitov2" `
            --icon src/PeluqueriaAdmin.App/Assets/kv-logo.ico `
            --runtime win-x64 `
            --outputDir Releases

      - name: Prepare exact installer and portable names
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $generatedSetup = Get-ChildItem -LiteralPath Releases -Filter "*Setup.exe" |
            Where-Object { $_.Name -ne "PeluqueriaAdmin-Setup-v$version.exe" } |
            Select-Object -First 1
          if ($null -eq $generatedSetup) {
            throw "Velopack no generó un instalador Setup.exe."
          }
          $generatedPortable = Get-ChildItem -LiteralPath Releases -Filter "*-Portable.zip" |
            Where-Object { $_.Name -ne "PeluqueriaAdmin-Portable-v$version-win-x64.zip" } |
            Select-Object -First 1
          if ($null -eq $generatedPortable) {
            throw "Velopack no generó un paquete Portable.zip."
          }

          Copy-Item -LiteralPath $generatedSetup.FullName `
            -Destination "Releases/PeluqueriaAdmin-Setup-v$version.exe"
          Copy-Item -LiteralPath $generatedPortable.FullName `
            -Destination "Releases/PeluqueriaAdmin-Portable-v$version-win-x64.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "upload", "github",
            "--repoUrl", "https://github.com/${{ github.repository }}",
            "--token", $env:VPK_TOKEN,
            "--outputDir", "Releases",
            "--publish", "true",
            "--releaseName", "Peluquería Admin ${{ steps.version.outputs.version }}",
            "--tag", "${{ github.ref_name }}")
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            $arguments += @("--pre", "true")
          }
          & .\.tools\vpk.exe @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish named assets and release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notesFile = "docs/NOTAS_VERSION_$version.md"
          if (-not (Test-Path -LiteralPath $notesFile)) {
            throw "No existe el archivo de notas requerido: $notesFile"
          }
          gh release upload "${{ github.ref_name }}" `
            "Releases/PeluqueriaAdmin-Setup-v$version.exe" `
            "Releases/PeluqueriaAdmin-Portable-v$version-win-x64.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release edit "${{ github.ref_name }}" `
            --title "Peluquería Admin $version" `
            --notes-file $notesFile `
            --prerelease=${{ steps.version.outputs.prerelease }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
